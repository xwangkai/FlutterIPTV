name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: false
        default: '1.0.0'
      build_target:
        description: 'Build target'
        required: true
        type: choice
        options:
          - android-tv
          - android-mobile
          - all
        default: 'android-tv'

env:
  FLUTTER_VERSION: '3.44.8'


jobs:
  # ============================================
  # Build Windows Application
  # ============================================
  build-windows:
    name: Build Windows
    if: github.event.inputs.build_target == 'all'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\Pub\Cache
          key: pub-windows-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-windows-

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Download SQLite3 DLL
        run: |
          $urls = @(
            "https://www.sqlite.org/2025/sqlite-dll-win-x64-3510100.zip",
            "https://www.sqlite.org/2024/sqlite-dll-win-x64-3470200.zip"
          )
          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile "sqlite3.zip" -TimeoutSec 30
              Expand-Archive -Path "sqlite3.zip" -DestinationPath "sqlite3_temp" -Force
              if (Test-Path "sqlite3_temp/sqlite3.dll") {
                Copy-Item "sqlite3_temp/sqlite3.dll" "build/windows/x64/runner/Release/" -Force
                break
              }
            } catch { continue }
          }
        shell: pwsh

      - name: Create Installer
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (!$version) { $version = "1.0.0" }
          @"
          [Setup]
          AppName=FlutterIPTV
          AppVersion=$version
          AppPublisher=FlutterIPTV
          DefaultDirName={autopf}\FlutterIPTV
          DefaultGroupName=FlutterIPTV
          OutputDir=.
          OutputBaseFilename=flutteriptv-Windows-x64-Setup
          Compression=lzma2
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=lowest
          [Files]
          Source: "build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs
          [Icons]
          Name: "{group}\FlutterIPTV"; Filename: "{app}\flutter_iptv.exe"
          Name: "{autodesktop}\FlutterIPTV"; Filename: "{app}\flutter_iptv.exe"; Tasks: desktopicon
          [Tasks]
          Name: "desktopicon"; Description: "Create desktop shortcut"; GroupDescription: "Additional icons:"
          [Run]
          Filename: "{app}\flutter_iptv.exe"; Description: "Launch FlutterIPTV"; Flags: nowait postinstall skipifsilent
          "@ | Out-File "installer.iss" -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: pwsh

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: flutteriptv-Windows-x64-Setup.exe
          retention-days: 5


  # ============================================
  # Shared Android Signing Setup (reusable steps)
  # ============================================
  build-android-mobile:
    name: Build Android Mobile
    if: github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'android-mobile'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-linux-

      - name: Cache CMake build objects
        uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: cmake-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('android/app/**') }}
          restore-keys: cmake-

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties << 'EOF'
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError
          EOF

      - name: Setup Android Signing
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "未找到 KEYSTORE_BASE64，自动生成临时密钥库..."
            keytool -genkeypair \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -storetype JKS \
              -keystore android/app/release-key.jks \
              -storepass android123 \
              -keypass android123 \
              -dname "CN=FlutterIPTV, O=FlutterIPTV, C=CN" \
              -noprompt
            STORE_PASS="android123"
            KEY_PASS="android123"
            KEY_ALIAS="release"
          else
            echo "使用 Secret 中的密钥库..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" \
              | tr -d '[:space:]' \
              | base64 --decode > android/app/release-key-orig.jks
            keytool -importkeystore \
              -srckeystore android/app/release-key-orig.jks \
              -destkeystore android/app/release-key.jks \
              -deststoretype JKS \
              -srcstorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -deststorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -srcalias "${{ secrets.KEY_ALIAS }}" \
              -destalias "${{ secrets.KEY_ALIAS }}" \
              -noprompt 2>&1 | grep -v "^Warning"
            rm -f android/app/release-key-orig.jks
            STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          fi
          cat > android/key.properties << EOF
          storePassword=${STORE_PASS}
          keyPassword=${KEY_PASS}
          keyAlias=${KEY_ALIAS}
          storeFile=release-key.jks
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build Mobile APKs
        run: |
          flutter build apk --release --no-tree-shake-icons --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/flutteriptv-Android-Mobile-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/flutteriptv-Android-Mobile-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/flutteriptv-Android-Mobile-x86_64.apk

      - name: Upload Mobile Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-mobile-release
          path: dist/
          retention-days: 5


  # ============================================
  # Build Android TV APK
  # ============================================
  build-android-tv:
    name: Build Android TV
    if: github.event.inputs.build_target == 'all' || github.event.inputs.build_target == 'android-tv'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-linux-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-linux-

      - name: Cache CMake build objects
        uses: actions/cache@v4
        with:
          path: android/app/.cxx
          key: cmake-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('android/app/**') }}
          restore-keys: cmake-

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties << 'EOF'
          org.gradle.caching=true
          org.gradle.parallel=true
          org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError
          EOF

      - name: Setup Android Signing
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "未找到 KEYSTORE_BASE64，自动生成临时密钥库..."
            keytool -genkeypair \
              -alias release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -storetype JKS \
              -keystore android/app/release-key.jks \
              -storepass android123 \
              -keypass android123 \
              -dname "CN=FlutterIPTV, O=FlutterIPTV, C=CN" \
              -noprompt
            STORE_PASS="android123"
            KEY_PASS="android123"
            KEY_ALIAS="release"
          else
            echo "使用 Secret 中的密钥库..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" \
              | tr -d '[:space:]' \
              | base64 --decode > android/app/release-key-orig.jks
            keytool -importkeystore \
              -srckeystore android/app/release-key-orig.jks \
              -destkeystore android/app/release-key.jks \
              -deststoretype JKS \
              -srcstorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -deststorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -srcalias "${{ secrets.KEY_ALIAS }}" \
              -destalias "${{ secrets.KEY_ALIAS }}" \
              -noprompt 2>&1 | grep -v "^Warning"
            rm -f android/app/release-key-orig.jks
            STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
            KEY_PASS="${{ secrets.KEY_PASSWORD }}"
            KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          fi
          cat > android/key.properties << EOF
          storePassword=${STORE_PASS}
          keyPassword=${KEY_PASS}
          keyAlias=${KEY_ALIAS}
          storeFile=release-key.jks
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Build TV APKs
        run: |
          flutter build apk --release --no-tree-shake-icons --dart-define=IS_TV=true --target-platform android-arm64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/flutteriptv-AndroidTV-arm64-v8a.apk

      - name: Upload TV Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-tv-release
          path: dist/
          retention-days: 5


  # ============================================
  # Create GitHub Release (only when building all)
  # ============================================
  create-release:
    name: Create Release
    if: github.event.inputs.build_target == 'all'
    needs: [build-windows, build-android-mobile, build-android-tv]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./release-assets/

      - name: Get version
        id: version
        run: |
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="${{ steps.version.outputs.TAG }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"

          if [ -f "docs/version.json" ]; then
            CHANGELOG_ZH=$(jq -r '.changelog.zh' docs/version.json)
            CHANGELOG_EN=$(jq -r '.changelog.en' docs/version.json)
          else
            PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | head -1)
            if [ -n "$PREV_TAG" ]; then
              CHANGELOG_ZH=$(git log --pretty=format:"- %s" ${PREV_TAG}..HEAD 2>/dev/null | grep -v "^- Merge" || echo "- Bug fixes and improvements")
              CHANGELOG_EN="${CHANGELOG_ZH}"
            else
              CHANGELOG_ZH="- 初始版本"
              CHANGELOG_EN="- Initial release"
            fi
          fi

          cat > release_notes.md << EOF
          ## 📺 FlutterIPTV ${VERSION}

          ### 📝 更新内容 What's New

          **中文 Chinese:**
          ${CHANGELOG_ZH}

          **English:**
          ${CHANGELOG_EN}

          ---

          ### 📥 下载 Downloads

          #### 🖥️ Windows
          | 文件 | 说明 |
          |------|------|
          | [flutteriptv-Windows-x64-Setup.exe](${BASE_URL}/flutteriptv-Windows-x64-Setup.exe) | Windows 64位安装包 |

          #### 📱 Android 手机版
          | 文件 | 说明 |
          |------|------|
          | [flutteriptv-Android-Mobile-arm64-v8a.apk](${BASE_URL}/flutteriptv-Android-Mobile-arm64-v8a.apk) | 64位 ARM 设备（推荐） |
          | [flutteriptv-Android-Mobile-armeabi-v7a.apk](${BASE_URL}/flutteriptv-Android-Mobile-armeabi-v7a.apk) | 32位 ARM 设备 |
          | [flutteriptv-Android-Mobile-x86_64.apk](${BASE_URL}/flutteriptv-Android-Mobile-x86_64.apk) | x86_64 模拟器 |

          #### 📺 Android TV 电视版
          | 文件 | 说明 |
          |------|------|
          | [flutteriptv-AndroidTV-arm64-v8a.apk](${BASE_URL}/flutteriptv-AndroidTV-arm64-v8a.apk) | 64位 ARM 电视（推荐） |
          EOF

      - name: Delete Existing Release (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.TAG }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          echo "已清理 tag $TAG 的旧 release（若存在）"

      - name: Locate Assets
        run: |
          mkdir -p ./release-assets/staged
          find ./release-assets -name "flutteriptv-Windows-x64-Setup.exe" -exec cp {} ./release-assets/staged/ \;
          find ./release-assets -name "*.apk" -exec cp {} ./release-assets/staged/ \;
          echo "定位到的资产:"
          ls -lh ./release-assets/staged/
          if ! ls ./release-assets/staged/*.exe >/dev/null 2>&1; then
            echo "::error::无法找到 Windows 安装包"
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: flutteriptv ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            release-assets/staged/flutteriptv-Windows-x64-Setup.exe
            release-assets/staged/flutteriptv-Android-Mobile-arm64-v8a.apk
            release-assets/staged/flutteriptv-Android-Mobile-armeabi-v7a.apk
            release-assets/staged/flutteriptv-Android-Mobile-x86_64.apk
            release-assets/staged/flutteriptv-AndroidTV-arm64-v8a.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
